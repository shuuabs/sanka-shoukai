<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参加者紹介メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;900&family=Shippori+Mincho+B1:wght@600;800&family=DotGothic16&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#16161f; --panel:#20202c; --line:#33334a; --text:#ececf4; --sub:#9a9ab0; --accent:#ff5c8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"M PLUS Rounded 1c","Meiryo",sans-serif; }
  .wrap { display:grid; grid-template-columns:420px 1fr; gap:16px; padding:16px; min-height:100vh; }
  @media (max-width:1000px){ .wrap { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; overflow:auto; max-height:calc(100vh - 32px); }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:14px; color:var(--sub); margin:18px 0 8px; font-weight:500; }
  label { display:block; font-size:12px; color:var(--sub); margin:8px 0 4px; }
  textarea { width:100%; min-height:90px; resize:vertical; padding:8px 10px; background:#151520; color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
  input[type=text], select { width:100%; padding:8px 10px; background:#151520; color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; }
  input[type=color] { width:48px; height:34px; border:none; background:none; padding:0; }
  .row { display:flex; gap:8px; align-items:center; }
  button { font:inherit; font-size:13px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#2a2a3a; color:var(--text); cursor:pointer; }
  button:hover { background:#34344a; }
  button.main { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:800; }
  .styles { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .styles button.on { border-color:var(--accent); background:#34344a; font-weight:800; }
  .person { display:grid; grid-template-columns:64px 1fr auto; gap:8px; align-items:start; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#1a1a26; }
  .thumb { width:64px; height:64px; border-radius:8px; background:#2a2a3a center/cover no-repeat; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--sub); text-align:center; white-space:pre; }
  .person input { margin-bottom:4px; padding:5px 8px; font-size:13px; }
  .person .subrow { display:flex; gap:4px; }
  .person .subrow select { width:auto; flex:none; margin-bottom:4px; padding:5px 4px; font-size:13px; }
  .person .subrow input { flex:1; min-width:0; }
  .ops { display:flex; flex-direction:column; gap:4px; }
  .ops button { padding:3px 8px; font-size:12px; }
  .stage { display:flex; flex-direction:column; gap:12px; }
  canvas { width:100%; height:auto; border-radius:8px; border:1px solid var(--line); background:#000; }
  .hint { font-size:12px; color:var(--sub); line-height:1.6; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:14px; text-align:center; font-size:13px; color:var(--sub); }
  .drop.over { border-color:var(--accent); color:var(--text); }
  .savebar { position:sticky; top:-16px; z-index:2; margin:-16px -16px 12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .savebar .status { font-size:12px; color:var(--sub); }
  .savebar .status.dirty { color:#ffc94d; font-weight:800; }
  .savebar .status.err { color:#ff6b6b; font-weight:800; }
  body.shot { background:#000; }
  body.shot .wrap { display:block; padding:0; }
  body.shot .panel, body.shot .stage .row { display:none; }
  body.shot canvas { width:1920px; border:none; border-radius:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="savebar">
      <button class="main" id="saveData">保存</button>
      <button id="discard">破棄（保存したところに戻す）</button>
      <span class="status" id="saveStatus">読みこみ中…</span>
      <div class="row" style="width:100%">
        <select id="slots" style="flex:1;min-width:0" title="保存したデータ"></select>
        <button id="slotOpen">開く</button>
        <button id="slotSaveAs">別名で保存</button>
        <button id="slotDelete">消す</button>
      </div>
    </div>
    <h1>参加者紹介メーカー</h1>

    <label>デザイン</label>
    <div class="styles" id="styles">
      <button data-s="neon">ネオン</button>
      <button data-s="pop">ポップ</button>
      <button data-s="cinema">シネマ</button>
      <button data-s="wa">和風</button>
      <button data-s="arena">アリーナ</button>
      <button data-s="clean">ミニマル</button>
      <button data-s="retro">レトロ</button>
      <button data-s="cheki">チェキ</button>
      <button data-s="tcg">トレカ</button>
    </div>

    <label>タイトル</label>
    <input type="text" id="title">
    <label>サブタイトル（日付・サーバー名など。Enter で2行目）</label>
    <textarea id="subtitle" rows="2" style="min-height:62px"></textarea>

    <div class="row" style="margin-top:8px">
      <div><label>メインの色</label><input type="color" id="theme"></div>
      <div style="flex:1"><label>アイコンの形（シネマ以外）</label>
        <select id="shape"><option value="circle">まる</option><option value="square">角まる四角</option></select>
      </div>
    </div>

    <label>背景の画像（なしでもOK）</label>
    <div class="row">
      <button id="bgBtn">画像をえらぶ</button>
      <button id="bgClear">背景を消す</button>
    </div>

    <label>ロゴ（背景が透明な PNG がおすすめ）</label>
    <div class="row">
      <button id="logoBtn">ロゴをえらぶ</button>
      <button id="logoClear">ロゴを消す</button>
    </div>
    <div class="row">
      <div style="flex:1"><label>置く場所</label>
        <select id="logoPos"><option value="title">タイトルの代わり</option><option value="tl">左上</option><option value="tr">右上</option></select>
      </div>
      <div style="flex:1"><label>大きさ</label><input type="range" id="logoSize" min="50" max="150" step="5" style="width:100%"></div>
    </div>

    <h2>参加者</h2>
    <div class="drop" id="drop">アイコン画像をまとめてここにドラッグすると、<br>ファイル名を名前にして一気に追加するよ</div>

    <label>X / Twitch の ID からアイコンを取ってくる（1日25人くらいまで）</label>
    <div class="row" style="margin-bottom:6px">
      <select id="src" style="width:auto"><option value="x">X</option><option value="twitch">Twitch</option></select>
      <button id="fetchIds">まとめて取ってくる</button>
    </div>
    <textarea id="ids" placeholder="1行に1人。@ はあってもなくてもOK&#10;例:&#10;@abc_123&#10;xyz_456"></textarea>
    <div class="hint" id="fetchMsg"></div>

    <div style="margin:8px 0" class="row">
      <button id="add">＋ 1人追加</button>
      <button id="sortTeam">チームごとに並べる</button>
    </div>
    <div style="margin:0 0 8px" class="row">
      <label style="margin:0;align-self:center">2行目のアイコンを全員</label>
      <select id="iconAll" data-n="1" style="width:auto"><option value="">えらぶ…</option><option value="none">なし</option><option value="tw">Twitch</option><option value="yt">YouTube</option><option value="mc">マイクラ</option></select>
    </div>
    <div style="margin:0 0 8px" class="row">
      <label style="margin:0;align-self:center;white-space:nowrap">ID アイコンの大きさ</label>
      <input type="range" id="iconScale" min="100" max="200" step="10" style="flex:1">
    </div>
    <div style="margin:0 0 8px" class="row">
      <label style="margin:0;align-self:center;white-space:nowrap">カードの縦の長さ</label>
      <input type="range" id="cardTall" min="100" max="140" step="5" style="flex:1">
      <span class="hint" id="cardTallVal" style="min-width:3.5em;text-align:right"></span>
    </div>
    <div id="list"></div>

    <p class="hint">・2行目は「役」「職業」「Twitch ID」など自由に。左のえらぶ所で、Twitch・YouTube のアイコンを付けられるよ。「マイクラ」にして2行目にマイクラの名前（英数字と _ ）を入れると、スキンの顔が出るよ<br>・チーム名を同じにすると、同じ色になるよ<br>・入れた内容はこのブラウザに自動で保存されるよ</p>
  </div>

  <div class="stage">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <div class="row">
      <button class="main" id="save">PNG で保存</button>
      <span class="hint">1920×1080（配信・X にそのまま使えるサイズ）</span>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="bgFile" accept="image/*" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>

<script>
const W = 1920, H = 1080;
const ROUND = '"M PLUS Rounded 1c","Meiryo",sans-serif';
const GOTHIC = '"Zen Kaku Gothic New","Meiryo",sans-serif';
const KEY = 'sanka-shoukai-v1';
const PALETTE = ['#ff5c8a','#4cc3ff','#ffc94d','#7be07b','#b48cff','#ff8f4d','#4de0d0','#ff6b6b','#f5a3ff','#a3c4ff'];

function defaultState() { return { style:'neon', title:'参加者紹介', subtitle:'', theme:'#ff5c8a', shape:'circle', bg:null, logo:null, logoPos:'title', logoSize:100, iconScale:140, cardTall:100, people:[] }; }
function defaultPeople() { return [1, 2, 3].map(n => ({ name:'さんかしゃ' + n, sub:'役・職業など', team:'', img:null })); }
let state = defaultState();
const params = new URLSearchParams(location.search);
const demo = parseInt(params.get('demo') || '0');
// 保存したデータは、下の loadSaved で読みこむ（IndexedDB は待つ必要があるので）
if (demo) {
  const names = ['あかね','ひなた','そうま','みお','れん','つむぎ','はると','さくら','ゆうと','ここな','かいと','のあ','りく','めい','そら','いろは','あおい','ゆい','たける','ななみ'];
  const jobs = ['警察','救急隊','ギャング','メカニック','市民','カフェ店員','記者','弁護士'];
  const teams = ['警察','救急','ギャング','市民'];
  state.title = '○○サーバー 参加者紹介'; state.subtitle = params.has('two') ? '2026.11.20 START\n毎晩 20:00〜 みんなで配信' : '2026.11.20 START';
  if (params.get('logo')) { state.logo = params.get('logo'); state.logoPos = params.get('lp') || 'title'; }
  state.people = names.slice(0, demo).map((n, i) => ({ name: n, sub: jobs[i % jobs.length], team: params.has('team') ? teams[i % teams.length] : '', img: null, subIcon: params.has('icon') ? ['tw', 'yt', ''][i % 3] : '' }));
}
if (params.get('style')) state.style = params.get('style');
if (params.get('tall')) state.cardTall = params.get('tall');
if (params.has('shot')) document.body.classList.add('shot');
if (!state.people.length) state.people = defaultPeople();

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const imgCache = new Map();

// 入っている字をフォントから読みこんでから描きなおす（日本語フォントは字ごとに分かれているため）
const FONT_SPECS = ['800 40px "M PLUS Rounded 1c"','500 40px "M PLUS Rounded 1c"','900 40px "Zen Kaku Gothic New"','500 40px "Zen Kaku Gothic New"','800 40px "Shippori Mincho B1"','600 40px "Shippori Mincho B1"','400 40px "DotGothic16"','600 40px "Klee One"'];
let fontTimer = null;
function ensureFonts() {
  clearTimeout(fontTimer);
  fontTimer = setTimeout(() => {
    const text = [state.title, state.subtitle, 'CASTMEMBERS▶★', ...state.people.flatMap(p => [p.name, p.sub, p.sub2, p.team])].join('');
    Promise.all(FONT_SPECS.map(f => document.fonts.load(f, text).catch(() => {}))).then(draw);
  }, 250);
}
// ---------- 保存（「保存」ボタンを押した時だけ。IndexedDB に入れる＝画像が多くても入る） ----------
// 前は localStorage に自動で保存していたが、5MB くらいで入りきらず、更新すると前の状態に戻っていた
// いくつでも名前をつけて保存できる。中は「slot:名前」→ データ、「current」→ 最後に使った名前
const DB_NAME = 'sanka-shoukai', DB_STORE = 'kv', SLOT = 'slot:', FIRST_SLOT = 'メイン';
let dirty = false;
let currentSlot = FIRST_SLOT;
function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbDo(mode, fn) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const t = db.transaction(DB_STORE, mode), q = fn(t.objectStore(DB_STORE));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbGet = key => dbDo('readonly', s => s.get(key));
const dbPut = (key, value) => dbDo('readwrite', s => s.put(value, key));
const dbDel = key => dbDo('readwrite', s => s.delete(key));
const dbKeys = () => dbDo('readonly', s => s.getAllKeys());
async function slotNames() { return (await dbKeys()).filter(k => String(k).startsWith(SLOT)).map(k => k.slice(SLOT.length)).sort((a, b) => a.localeCompare(b, 'ja')); }
async function renderSlots() {
  const sel = $('slots'); let names = [];
  try { names = await slotNames(); } catch (e) {}
  if (!names.includes(currentSlot)) names.unshift(currentSlot);
  sel.innerHTML = '';
  names.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n === currentSlot ? `${n}（開いている）` : n; sel.appendChild(o); });
  sel.value = currentSlot;
}
function setStatus(text, cls) { const el = $('saveStatus'); el.textContent = text; el.className = 'status' + (cls ? ' ' + cls : ''); }
function markDirty() { if (demo) return; dirty = true; setStatus(`● 「${currentSlot}」に保存していない変更があるよ`, 'dirty'); }
// 何か変えた時に呼ばれる（名前は前のまま）。ここでは保存しないで「変更あり」にするだけ
function save() { ensureFonts(); markDirty(); }
async function saveNow(name) {
  if (demo) return;
  name = name || currentSlot;
  setStatus('保存中…');
  try {
    await dbPut(SLOT + name, JSON.stringify(state));
    await dbPut('current', name);
    try { localStorage.removeItem(KEY); } catch (e) {}
    currentSlot = name; dirty = false;
    const t = new Date();
    setStatus(`「${name}」に保存したよ（${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}）`);
    renderSlots();
  } catch (e) {
    setStatus('保存できなかった。閉じる前に PNG で保存しておいてね', 'err');
  }
}
async function loadSlot(name) {
  let s = null;
  try { s = await dbGet(SLOT + name); } catch (e) {}
  return s ? JSON.parse(s) : null;
}
// はじめに開くデータ（最後に使ったもの）。1つめの版（'state'）と、その前の localStorage からも引っこす
async function loadSaved() {
  try { const c = await dbGet('current'); if (c) currentSlot = c; } catch (e) {}
  let s = await loadSlot(currentSlot);
  if (!s && currentSlot === FIRST_SLOT) {
    let old = null;
    try { old = await dbGet('state'); } catch (e) {}
    if (!old) { try { old = localStorage.getItem(KEY); } catch (e) {} }
    if (old) s = JSON.parse(old);
  }
  return s;
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
function getImg(src) {
  if (!src) return null;
  if (imgCache.has(src)) return imgCache.get(src);
  const im = new Image(); im.onload = () => draw(); im.src = src;
  imgCache.set(src, im); return im;
}
function ready(im) { return im && im.complete && im.naturalWidth; }
function readImage(file, max, type) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const g = c.getContext('2d');
        // JPEG は透明が黒になるので、白でうめてから描きなおす
        if ((type || 'image/jpeg') === 'image/jpeg') { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        res(c.toDataURL(type || 'image/jpeg', 0.9));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function teamColor(team) {
  if (!team) return state.theme;
  const teams = [...new Set(state.people.map(p => p.team).filter(Boolean))];
  return PALETTE[teams.indexOf(team) % PALETTE.length];
}

// ---------- 色の道具 ----------
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function alpha(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function hueShift(h, deg) {
  let [r, g, b] = hex2rgb(h).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let hh = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh /= 6; }
  hh = (hh + deg / 360 + 1) % 1;
  const f = (p, q, t) => { t = (t + 1) % 1; return t < 1/6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  return '#' + [f(p, q, hh + 1/3), f(p, q, hh), f(p, q, hh - 1/3)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}

// ---------- 描画の道具 ----------
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function setFont(size, weight, fam) { ctx.font = `${weight} ${size}px ${fam}`; }
function fit(text, maxW, size, weight, fam) {
  let s = size;
  do { setFont(s, weight, fam); if (ctx.measureText(text).width <= maxW) break; s -= 1; } while (s > 10);
  return s;
}
// ---------- 2行目の左のアイコン（YouTube / Twitch / なし） ----------
// 2行目・3行目のどちらか（n = 1 か 2）の、入っている場所の名前
const LINE = {
  1: { text: 'sub', icon: 'subIcon', face: 'mcFace', faceFor: 'mcFaceFor' },
  2: { text: 'sub2', icon: 'sub2Icon', face: 'mcFace2', faceFor: 'mcFace2For' },
};
function platformIcon(kind, face, x, y, s) {
  ctx.save();
  if (kind === 'mc') {
    // マイクラのスキンの顔（取ってくるまでは灰色の四角）
    const im = getImg(face);
    if (ready(im)) { ctx.imageSmoothingEnabled = false; ctx.drawImage(im, x, y, s, s); }
    else { ctx.fillStyle = 'rgba(128,128,128,0.6)'; ctx.fillRect(x, y, s, s); }
  } else if (kind === 'yt') {
    const h = s * 0.72, top = y + (s - h) / 2;
    ctx.fillStyle = '#ff0033'; rr(x, top, s, h, h * 0.28); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.moveTo(x + s * 0.40, top + h * 0.27); ctx.lineTo(x + s * 0.40, top + h * 0.73); ctx.lineTo(x + s * 0.68, top + h * 0.5); ctx.closePath(); ctx.fill();
  } else if (kind === 'tw') {
    const P = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([u, v], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, x + u * s, y + v * s)); ctx.closePath(); ctx.fill(); };
    P([[0.14,0],[0.92,0],[0.92,0.56],[0.60,0.86],[0.42,0.86],[0.26,1],[0.26,0.86],[0.08,0.86],[0.08,0.16]], '#9146ff');
    P([[0.19,0.09],[0.83,0.09],[0.83,0.51],[0.66,0.68],[0.47,0.68],[0.35,0.80],[0.35,0.68],[0.19,0.68]], '#fff');
    ctx.fillStyle = '#9146ff'; ctx.fillRect(x + s * 0.43, y + s * 0.22, s * 0.08, s * 0.24); ctx.fillRect(x + s * 0.63, y + s * 0.22, s * 0.08, s * 0.24);
  }
  ctx.restore();
}

}

  for (let k = 3; k >= 0; k--) ctx.lineTo(-w / 2 + (k % 2 ? 5 : 0), -h / 2 + h * k / 4);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(-w / 2 + 6, -h / 2 + h * 0.2, w - 12, h * 0.18);

}

  return g;
}

  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}

const STYLES = { neon, pop, cinema, wa, arena, clean, retro, cheki, tcg };
function draw() {
  const S = STYLES[state.style] || neon;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  S.bg(); S.header(); cornerLogo();
  const n = state.people.length; if (!n) return;
  // カードの縦の長さ（％）。ID を2段にした時などにはみ出さないように
  const tall = (parseFloat(state.cardTall) || 100) / 100;
  layout(n, S.top, 50, S.ratio * tall, S.maxW || 320, 70).forEach(c => {
    if (state.style === 'pop') { ctx.save(); ctx.translate(c.x, c.y); S.card(state.people[c.i], 0, 0, c.w, c.h, c.i); ctx.restore(); }
    else S.card(state.people[c.i], c.x, c.y, c.w, c.h, c.i);

// ---------- 入力欄 ----------
const ICON_OPTIONS = [['', 'なし'], ['tw', 'Twitch'], ['yt', 'YouTube'], ['mc', 'マイクラ']];
let pickFor = null;
function renderList() {
  const list = $('list'); list.innerHTML = '';
  state.people.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'person';
    const th = document.createElement('div'); th.className = 'thumb';
    if (p.img) th.style.backgroundImage = `url(${p.img})`; else th.textContent = '画像を\nえらぶ';
    th.onclick = () => { pickFor = i; $('file').click(); };
    const f = document.createElement('div');
    [['name','名前'],['sub','2行目（役・ID など）'],['team','チーム名（なしでもOK）']].forEach(([k, ph]) => {
      const n = k === 'sub' ? 1 : k === 'sub2' ? 2 : 0;
      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = ph; inp.value = p[k] || '';
      inp.oninput = () => { p[k] = inp.value; save(); draw(); if (n) fetchFaceSoon(p, n); };
      if (n) {
        // 2行目・3行目の左のアイコン（なし・Twitch・YouTube・マイクラ）
        const L = LINE[n];
        const wrap = document.createElement('div'); wrap.className = 'subrow';
        const sel = document.createElement('select'); sel.title = (n + 1) + '行目の左のアイコン';
        ICON_OPTIONS.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); });
        sel.value = p[L.icon] || '';
        sel.onchange = () => { p[L.icon] = sel.value; save(); draw(); fetchFace(p, n); };
        wrap.append(sel, inp); f.appendChild(wrap);
      } else f.appendChild(inp);
    });
    const ops = document.createElement('div'); ops.className = 'ops';
    const mk = (t, fn) => { const b = document.createElement('button'); b.textContent = t; b.onclick = fn; ops.appendChild(b); };
    mk('↑', () => { if (i > 0) { [state.people[i - 1], state.people[i]] = [state.people[i], state.people[i - 1]]; update(); } });
    mk('↓', () => { if (i < state.people.length - 1) { [state.people[i + 1], state.people[i]] = [state.people[i], state.people[i + 1]]; update(); } });
    mk('×', () => { if (confirm(`${p.name || 'この人'} を消す？`)) { state.people.splice(i, 1); update(); } });
    d.append(th, f, ops); list.appendChild(d);
  });
}

};
$('logoClear').onclick = () => { state.logo = null; update(); };
$('add').onclick = () => { state.people.push({ name:'', sub:'', team:'', img:null }); update(); };
['iconAll'].forEach(id => $(id).onchange = () => {
  const el = $(id), v = el.value, n = Number(el.dataset.n); if (!v) return;
  state.people.forEach(p => { p[LINE[n].icon] = v === 'none' ? '' : v; });
  el.value = ''; update();
  if (v === 'mc') (async () => { for (const p of state.people) await fetchFace(p, n); })();
});
$('sortTeam').onclick = () => {
  const teams = [...new Set(state.people.map(p => p.team || ''))];
  state.people.sort((a, b) => teams.indexOf(a.team || '') - teams.indexOf(b.team || '')); update();
};
const FIELDS = ['title','subtitle','theme','shape','logoPos','logoSize','iconScale','cardTall'];
function applyInputs() {
  FIELDS.forEach(k => { $(k).value = state[k] == null ? '' : state[k]; });
  $('cardTallVal').textContent = (state.cardTall || 100) + '%';
  document.documentElement.style.setProperty('--accent', state.theme);
}
FIELDS.forEach(k => {
  const el = $(k);
  el.oninput = el.onchange = () => { state[k] = el.value; document.documentElement.style.setProperty('--accent', state.theme); $('cardTallVal').textContent = (state.cardTall || 100) + '%'; save(); draw(); };
});
applyInputs();
// 保存したデータを画面に出す（変更なしのあつかい）
function applyLoaded(saved) {
  state = Object.assign(defaultState(), saved || {});
  if (!state.people.length) state.people = defaultPeople();
  applyInputs(); renderList(); renderStyles(); draw(); ensureFonts();
  dirty = false;
}
$('saveData').onclick = () => saveNow();
$('discard').onclick = async () => {
  if (dirty && !confirm(`保存していない変更を消して、「${currentSlot}」の最後に保存したところに戻す？`)) return;
  const saved = await loadSlot(currentSlot);
  applyLoaded(saved);
  setStatus(saved ? `「${currentSlot}」の最後に保存したところに戻したよ` : 'まだ保存したものがないので、はじめの状態に戻したよ');
};
$('slotOpen').onclick = async () => {
  const name = $('slots').value;
  if (!name || name === currentSlot && !dirty) return;
  if (dirty && !confirm(`「${currentSlot}」に保存していない変更があるよ。消して「${name}」を開く？`)) { $('slots').value = currentSlot; return; }
  const saved = await loadSlot(name);
  if (!saved) { setStatus(`「${name}」はまだ保存されていないよ`, 'err'); return; }
  currentSlot = name; applyLoaded(saved);
  try { await dbPut('current', name); } catch (e) {}
  setStatus(`「${name}」を開いたよ`); renderSlots();
};
$('slotSaveAs').onclick = async () => {
  const name = (prompt('保存する名前は？（例: 本番用、テスト、トレカ版）', '') || '').trim();
  if (!name) return;
  let names = []; try { names = await slotNames(); } catch (e) {}
  if (names.includes(name) && name !== currentSlot && !confirm(`「${name}」はもうあるよ。上書きする？`)) return;
  saveNow(name);
};
$('slotDelete').onclick = async () => {
  const name = $('slots').value; if (!name) return;
  if (!confirm(`「${name}」を消す？ 消したら元に戻せないよ`)) return;
  try { await dbDel(SLOT + name); } catch (e) { setStatus('消せなかった', 'err'); return; }
  if (name === currentSlot) { dirty = true; setStatus(`「${name}」を消したよ。画面の内容はまだ残っているから、いるなら「保存」か「別名で保存」してね`, 'dirty'); }
  else setStatus(`「${name}」を消したよ`);
  renderSlots();
};
// Ctrl+S でも保存
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); } });

const drop = $('drop');
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === 'drop' || e.target === document.documentElement) drop.classList.remove('over'); }));
function isDummy() { return state.people.every(p => !p.img && /^さんかしゃ\d$/.test(p.name)); }
document.addEventListener('drop', async e => {
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (files.length && isDummy()) state.people = [];
  for (const f of files) state.people.push({ name: f.name.replace(/\.[^.]+$/, ''), sub:'', team:'', img: await readImage(f, 500) });
  update();
});

$('fetchIds').onclick = async () => {
  const src = $('src').value;
  const ids = $('ids').value.split(/\r?\n/).map(s => s.trim().replace(/^@/, '').replace(/^https?:\/\/(www\.)?(x|twitter|twitch)\.(com|tv)\//, '').split(/[/?]/)[0]).filter(Boolean);
  if (!ids.length) return;
  if (isDummy()) state.people = [];
  const msg = $('fetchMsg'), ng = [];
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    msg.textContent = `取ってきてるよ… ${i + 1} / ${ids.length}（${id}）`;
    try {
      const r = await fetch(`https://unavatar.io/${src}/${encodeURIComponent(id)}?fallback=false`);
      if (r.status === 429) { ng.push(...ids.slice(i)); msg.textContent = ''; alert('今日の上限に来ちゃった。残りは明日か、画像を手で入れてね'); break; }
      if (!r.ok) throw new Error(r.status);
      const img = await readImage(await r.blob(), 500);
      const old = state.people.find(p => p.xid === id);
      if (old) old.img = img; else state.people.push({ name: id, sub: '', team: '', img, xid: id });
      update();
    } catch (e) { ng.push(id); }
  }
  msg.textContent = ng.length ? `取れなかった ID: ${ng.join(', ')}（つづりか、鍵アカかも）` : 'ぜんぶ取れたよ。名前は表示名に書きかえてね';
  $('ids').value = ng.join('\n');
};

$('save').onclick = () => {
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = (state.title || '参加者紹介').replace(/[\\/:*?"<>|]/g, '_') + '.png';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};

renderList(); renderStyles();
draw(); ensureFonts();
if (demo) { setStatus('見本の表示中（保存しない）'); }
else {
  loadSaved().then(saved => {
    if (saved) { applyLoaded(saved); setStatus(`「${currentSlot}」を読みこんだよ`); }
    else setStatus('まだ保存していないよ');
    renderSlots();
  }).catch(() => setStatus('保存したデータを読めなかった', 'err'));
}
</script>
</body>
</html>
